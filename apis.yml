name: ArrowPoint Communications
description: ArrowPoint Communications, Inc. was a Massachusetts-based content-networking company that
  built "content smart" web switches for server load balancing, content delivery, and web caching in the
  late 1990s. After a January 2000 IPO it was acquired by Cisco Systems in 2000 for approximately $5.7
  billion in stock, and its technology became the basis of the Cisco Content Services Switch (CSS) product
  line. It has not operated as an independent company since the acquisition, and it exposes no public
  developer program, API, documentation, or other machine-readable surface today; this record is retained
  for network/portfolio lineage rather than active API enrichment.
